<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap');

:root {
  --bg:#000; --surface:#0d1117; --surface2:#151b26; --line:#222b3a;
  --text:#f4f7fc; --muted:#8e9bb2; --accent:#6c8cff;
  --radius-lg:18px; --radius-md:14px;
  --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.45;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit}
.app{width:100%;max-width:580px;padding:28px 18px 48px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.eyebrow{font:500 .62rem var(--mono);letter-spacing:.15em;color:var(--muted);margin-bottom:7px}
.head h1{font-size:1.75rem;line-height:1.1;letter-spacing:-.04em}
.head h1 span{color:var(--accent)}
.head p:last-child{font-size:.82rem;color:var(--muted);margin-top:6px}
.badge{font:500 .62rem var(--mono);letter-spacing:.08em;padding:7px 10px;border-radius:40px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.date-banner{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.date-banner:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.date-main,.date-side{display:flex;flex-direction:column;gap:2px}.date-name,.day-name{font-weight:700}
.day-name{font-size:1rem}.full-date,.time-now{font: .68rem var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.date-side{align-items:flex-end}.today-tag{font:600 .6rem var(--mono);padding:3px 8px;border-radius:40px;background:#6c8cff26;color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
.main-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;background:#090c11;border:1px solid var(--line);border-radius:16px}
.main-tab{border:1px solid transparent;border-radius:11px;padding:13px 8px;background:transparent;color:var(--muted);font-size:.86rem;font-weight:700;cursor:pointer;transition:.2s}
.main-tab:hover{background:var(--surface2);color:var(--text)}
.main-tab.active{background:var(--surface2);border-color:#39496a;color:var(--text);box-shadow:0 5px 18px #0008}
.main-tab.active .tab-icon{color:var(--accent)}.tab-icon{margin-right:6px;font-size:1rem}
.day-nav{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day-tile{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.2s;touch-action:manipulation}
.day-tile:hover{background:var(--surface2);color:var(--text)}
.day-tile .label{font-size:.78rem;font-weight:700}
.day-tile:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:3px;border-radius:4px 4px 0 0;background:var(--tile-accent,var(--accent));transition:width .2s}
.day-tile.active{background:var(--surface2);border-color:var(--tile-accent,var(--accent));color:var(--text)}
.day-tile.active:after{width:65%}.day-tile.active .label{color:var(--tile-accent,var(--accent))}
.today-dot{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--tile-accent,var(--accent));opacity:0}
.day-tile.is-today .today-dot{opacity:1}
.day-tile[data-day="Mon"]{--tile-accent:#7fb2ff}.day-tile[data-day="Tue"]{--tile-accent:#67e0b0}.day-tile[data-day="Wed"]{--tile-accent:#b89bff}.day-tile[data-day="Thu"]{--tile-accent:#ffa8bc}.day-tile[data-day="Fri"]{--tile-accent:#ffd27a}.day-tile[data-day="Sat"]{--tile-accent:#7fe0eb}.day-tile[data-day="Sun"]{--tile-accent:#f0a7ff}
.day-strip{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 2px}
.day-strip h2{font-size:1.45rem;letter-spacing:-.03em}.meta{font: .65rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.meta b{color:var(--text)}
.schedule{display:flex;flex-direction:column;gap:10px}
.period{position:relative;display:flex;gap:14px;padding:16px 18px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden;animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.period:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tint,var(--accent))}
.period .slot{min-width:66px;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--line);padding:2px 13px 0 0}
.pnum{font:700 1rem var(--mono);color:var(--tint,var(--accent));line-height:1.2;text-align:center}
.ptime{font:.58rem var(--mono);color:var(--muted);text-align:center;margin-top:6px;white-space:pre-line;line-height:1.45}
.period .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.subj{font-size:1rem;font-weight:700;letter-spacing:-.015em;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tag{font:500 .57rem var(--mono);letter-spacing:.06em;padding:3px 7px;border-radius:30px;background:var(--tint,var(--accent));color:#05070b;flex-shrink:0}
.detail{font-size:.8rem;color:var(--muted);line-height:1.5}
.p-math{--tint:#a9c1ff}.p-cprog{--tint:#8be8bb}.p-lab{--tint:#c6a8ff}.p-evs{--tint:#ffa8bc}.p-ca{--tint:#ffc97a}.p-iks{--tint:#7fe0eb}.p-ge{--tint:#c3ccdd}.p-snk{--tint:#f5d86a}
.p-breakfast{--tint:#ffd27a}.p-lunch{--tint:#67e0b0}.p-snacks{--tint:#c6a8ff}.p-dinner{--tint:#7fb2ff}
.meal-card .slot{min-width:82px}.meal-card .pnum{font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase}
.meal-card .subj{font-size:1rem}.meal-card .detail{font-size:.82rem}
.empty{padding:36px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius-lg)}
.foot{display:flex;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid var(--line);font:.59rem var(--mono);letter-spacing:.09em;color:var(--muted)}
.footer-dot{color:var(--accent)}
@media(max-width:390px){.app{padding:22px 13px 36px;gap:16px}.head h1{font-size:1.5rem}.badge{font-size:.53rem;padding:6px 7px}.day-nav{gap:4px}.day-tile{padding:12px 1px}.day-tile .label{font-size:.7rem}.period{padding:14px 13px;gap:10px}.period .slot{min-width:57px;padding-right:9px}.meal-card .slot{min-width:72px}.subj{font-size:.94rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

body{background:radial-gradient(ellipse at 12% 0%,#f7e9e8 0,transparent 38%),linear-gradient(180deg,#f7f6f4,#f0efed);color:var(--text);display:block}

.welcome-panel{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:25px 27px;border-radius:20px;background:linear-gradient(115deg,#571827,#7b1e32 62%,#92364a);color:#fff;box-shadow:0 12px 28px #681d2d24}.welcome-panel:before{content:"";position:absolute;width:290px;height:290px;border:1px solid #ffffff18;border-radius:50%;right:8%;top:-205px;box-shadow:0 0 0 24px #ffffff08,0 0 0 48px #ffffff06}.welcome-panel .eyebrow{color:#e4c8bd;margin-bottom:8px}.welcome-panel h1{font-size:clamp(1.65rem,4vw,2.25rem);letter-spacing:-.045em;line-height:1.1}.welcome-panel h1 span{color:#f1d69d}.welcome-panel p:last-child{color:#f0dfe0;font-size:.86rem;margin-top:8px}.welcome-panel .badge{background:#ffffff16;border:1px solid #ffffff35;color:#fff;z-index:1}.welcome-watermark{position:absolute;right:24px;bottom:-35px;font:700 8rem Georgia,serif;color:#ffffff0b;pointer-events:none}
.date-banner{background:#fff;border-color:#e8e0d9;box-shadow:0 4px 15px #3d1d2408;padding:16px 20px}.date-banner:before{background:#c49a50}.day-name{color:#322c30}.full-date,.time-now{color:#8a8180}.today-tag{background:#f6edf0;color:#7b1e32}.main-nav{background:#eae5e1;border:1px solid #e0d8d2;padding:5px;border-radius:14px}.main-tab{color:#746c6a}.main-tab:hover{background:#fff;color:#671d2e}.main-tab.active{background:#fff;border-color:#e6d8d8;color:#641c2b;box-shadow:0 3px 10px #3d1d2410}.main-tab.active .tab-icon{color:#a77c3e}

.day-strip{padding:5px 2px 0}.day-strip h2{font-size:1.5rem;color:#332a2d}.meta{color:#8a8180}.meta b{color:#7b1e32}.schedule{gap:11px}.period{background:#fff;border-color:#e9e2dc;box-shadow:0 4px 14px #3d1d2408;padding:17px 20px;transition:transform .18s ease,box-shadow .18s ease}.period:hover{transform:translateY(-2px);box-shadow:0 8px 20px #3d1d2413}.period:before{width:4px}.period .slot{border-color:#eee7e2}.pnum{color:#7b1e32}.ptime{color:#8c8380}.subj{color:#30282d}.detail{color:#80777a}.tag{background:#f4e9eb;color:#7b1e32;border:1px solid #ead7dc}.p-math,.p-cprog,.p-lab,.p-evs,.p-ca,.p-iks,.p-ge,.p-snk{--tint:#7b1e32}.p-breakfast,.p-lunch,.p-snacks,.p-dinner{--tint:#7b1e32}.meal-card .tag{background:#f5eee3;color:#795b2d;border-color:#eadfc9}.empty{background:#fff;border-color:#dfd2d0;color:#766d6d}.foot{border-color:#e4dcd5;color:#8c8180}.footer-dot{color:#a57b42}

/* ===== Distinct colour system for every timetable section ===== */
:root{
  --class-accent:#7b1e32;
  --meal-accent:#16836b;
  --math:#4778c7; --cprog:#18845f; --lab:#7954b5; --evs:#258b91;
  --ca:#c17a24; --iks:#bd5577; --ge:#65758b; --snk:#a27a25;
  --breakfast:#c17a24; --lunch:#16836b; --snacks:#7954b5; --dinner:#4778c7;
}
/* Navigation changes identity with the selected section */
.app[data-view="class"] .main-tab[data-view="class"].active{
  background:#7b1e32;color:#fff;border-color:#7b1e32;box-shadow:0 5px 14px #7b1e3228
}
.app[data-view="class"] .main-tab[data-view="class"].active .tab-icon{color:#f2d49b}
.app[data-view="meal"] .main-tab[data-view="meal"].active{
  background:#16836b;color:#fff;border-color:#16836b;box-shadow:0 5px 14px #16836b2b
}
.app[data-view="meal"] .main-tab[data-view="meal"].active .tab-icon{color:#d5f7e9}
.app[data-view="class"] .welcome-panel{background:linear-gradient(115deg,#571827,#7b1e32 62%,#96394d)}
.app[data-view="meal"] .welcome-panel{background:linear-gradient(115deg,#105c4e,#16836b 62%,#269b7d)}
.app[data-view="meal"] .welcome-panel h1 span{color:#c8f1df}
.app[data-view="meal"] .date-banner:before{background:#16836b}
.app[data-view="meal"] .today-tag{background:#e3f4ee;color:#16836b}
.app[data-view="meal"] .footer-dot{color:#16836b}
.app[data-view="class"] .footer-dot{color:#7b1e32}

/* Subject-specific class cards */
.period.p-math{--tint:var(--math);--wash:#edf3ff}
.period.p-cprog{--tint:var(--cprog);--wash:#eaf6f0}
.period.p-lab{--tint:var(--lab);--wash:#f2edfa}
.period.p-evs{--tint:var(--evs);--wash:#eaf6f6}
.period.p-ca{--tint:var(--ca);--wash:#fbf2e7}
.period.p-iks{--tint:var(--iks);--wash:#faedf2}
.period.p-ge{--tint:var(--ge);--wash:#eff2f6}
.period.p-snk{--tint:var(--snk);--wash:#f8f3e6}
.period.p-recess{--tint:#8b929d;--wash:#f0f1f3}

/* Meal-category cards: each meal has its own recognizable colour */
.period.p-breakfast{--tint:var(--breakfast);--wash:#fbf2e7}
.period.p-lunch{--tint:var(--lunch);--wash:#eaf6f0}
.period.p-snacks{--tint:var(--snacks);--wash:#f2edfa}
.period.p-dinner{--tint:var(--dinner);--wash:#edf3ff}
.period{background:linear-gradient(100deg,var(--wash,#fff) 0%,#fff 38%);border-color:color-mix(in srgb,var(--tint,#7b1e32) 19%,#fff);}
.period:before{background:var(--tint,#7b1e32);width:5px}
.period .slot{border-right-color:color-mix(in srgb,var(--tint,#7b1e32) 20%,#fff)}
.period .pnum{color:var(--tint,#7b1e32)}
.period .tag{background:color-mix(in srgb,var(--tint,#7b1e32) 12%,#fff);color:var(--tint,#7b1e32);border:1px solid color-mix(in srgb,var(--tint,#7b1e32) 25%,#fff)}
.period:hover{border-color:color-mix(in srgb,var(--tint,#7b1e32) 38%,#fff);box-shadow:0 9px 22px color-mix(in srgb,var(--tint,#7b1e32) 13%,transparent)}
.day-strip h2{color:#332a2d}
.app[data-view="meal"] .day-strip h2{color:#146c59}
.app[data-view="class"] .day-strip h2{color:#7b1e32}
@media(max-width:620px){.period{background:linear-gradient(100deg,var(--wash,#fff) 0%,#fff 48%)}}

  </style>

  const CLASS_TIMETABLE = {

    Wed:[['1','12:05 – 1:00 PM','C / Programming','Roshan Sir','cprog','C'],['R','1:00 – 1:35 PM','Recess','','recess','BREAK'],['2','1:35 – 2:30 PM','Mathematics','Ashish Sir','math','MATH'],['3','2:35 – 3:30 PM','IKS','Vijeta Ma’am','iks','IKS'],['4','3:35 – 4:30 PM','EVS','Mandira Ma’am','evs','EVS']],
    Thu:[['1','12:05 – 1:00 PM','LAB / NF7','','lab','LAB'],['R','1:00 – 1:35 PM','Recess','','recess','BREAK'],['2','1:35 – 2:30 PM','C / Programming','Roshan Sir','cprog','C'],['3','2:35 – 3:30 PM','CA','Prerna Ma’am','ca','CA'],['4','3:35 – 4:30 PM','GE','Keshav Sir','ge','GE']],
    Fri:[['1','12:05 – 1:00 PM','SNK Language','Poonam Ma’am','snk','SNK'],['R','1:00 – 1:35 PM','Recess','','recess','BREAK'],['2','1:35 – 2:30 PM','CA','Prerna Ma’am','ca','CA'],['3','2:35 – 3:30 PM','C / Programming','Roshan Sir','cprog','C'],['4','3:35 – 4:30 PM','GE','Keshav Sir','ge','GE']]
  };

  // Menu transcribed from the uploaded hostel food-routine photograph.
  const MEAL_TIMETABLE = {
    Mon:[
      ['Breakfast','Poha, Green Chutney','BREAKFAST','7FB2FF'],
      ['Lunch','Chawal, Dal, Kabli Chana, Bhujia, Papad','LUNCH','67E0B0'],
      ['Snacks','Chowmein, Milk Tea','SNACKS','C6A8FF'],

    ],
    Tue:[

      ['Lunch','Chawal, Dal, Besan Sabji, Chokha, Papad','LUNCH','67E0B0'],
      ['Snacks','Sattu Kachori, Nimbu Chai','SNACKS','C6A8FF'],

    ],
    Wed:[
      ['Breakfast','Puri, Aalu Chana','BREAKFAST','7FB2FF'],
      ['Lunch','Chawal, Dal, Bhujia, Seasonal Sabji, Papad','LUNCH','67E0B0'],
      ['Snacks','Tikki Chaat, Milk Tea','SNACKS','C6A8FF'],
      ['Dinner','Roti, Chawal, Anda Curry, Manchurian, Salad','DINNER','7FB2FF']
    ],
    Thu:[
      ['Breakfast','Roti, Chana Dal','BREAKFAST','7FB2FF'],
      ['Lunch','Chawal, Dal, Chokha, Seasonal Sabji, Papad','LUNCH','67E0B0'],
      ['Snacks','Samosa, Tomato Sauce, Nimbu Chai','SNACKS','C6A8FF'],
      ['Dinner','Jeera Normal Rice, Roti, Aalu Dal, Soyabin','DINNER','7FB2FF']
    ],
    Fri:[

      ['Lunch','Chawal, Dal, Bhujia, Seasonal Sabji, Papad','LUNCH','67E0B0'],
      ['Snacks','Piyaj Pakodi, Tomato Sauce, Milk Tea','SNACKS','C6A8FF'],
      ['Dinner','Roti, Rice, Dal, Paneer Masala / Chicken Masala','DINNER','7FB2FF']
    ],
    Sat:[
      ['Breakfast','Roti, Kabli Chana','BREAKFAST','7FB2FF'],
      ['Lunch','Khichdi, Chokha, Achar, Papad','LUNCH','67E0B0'],
      ['Snacks','Litti Chokha, Lemon Tea','SNACKS','C6A8FF'],
      ['Dinner','Fried Normal Rice, Seasonal Sabji, Roti, Tadka, Milk','DINNER','7FB2FF']
    ],
    Sun:[
      ['Breakfast','Aalu Paratha (3 pcs), Chutney','BREAKFAST','7FB2FF'],
      ['Lunch','Chawal, Dal, Bhujia, Aalu Chana, Papad','LUNCH','67E0B0'],
      ['Snacks','Aalu Chop, Milk Tea','SNACKS','C6A8FF'],
      ['Dinner','Roti, Rice, Chicken Masala, Soya Chilli, Salad','DINNER','7FB2FF']
    ]
  };

  const DAY_NAMES={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
  const DAY_KEYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const JS_DAY_TO_KEY={1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri',6:'Sat',0:'Sun'};
  const $=id=>document.getElementById(id);
  const schedule=$('schedule');
  let activeDay=null, activeView='class';

  function todayKey(){return JS_DAY_TO_KEY[new Date().getDay()];}
  function updateClock(){
    const now=new Date();
    $('liveDayName').textContent=now.toLocaleDateString(undefined,{weekday:'long'});
    $('liveFullDate').textContent=now.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    $('liveTime').textContent=now.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
    $('todayTag').textContent='Today';
  }
  function markToday(){
    document.querySelectorAll('.day-tile').forEach(b=>b.classList.toggle('is-today',b.dataset.day===todayKey()));
  }
  function renderClass(day){
    const rows=CLASS_TIMETABLE[day]||[];
    $('dayCount').textContent=rows.filter(r=>r[4]!=='recess').length;
    $('countLabel').textContent='classes';
    $('footerLeft').textContent='PERIODS · 55 MIN';
    $('footerRight').textContent='RECESS · 35 MIN';
    if(!rows.length){schedule.innerHTML='<div class="empty">No class timetable available for this day.</div>';return;}
    schedule.innerHTML=rows.map((r,i)=>{
      const [period,time,subject,teacher,type,abbr]=r;
      const recess=type==='recess';
      return `<article class="period ${recess?'':'p-'+type}" style="animation-delay:${i*.04}s">
        <div class="slot"><span class="pnum">${period}</span><span class="ptime">${time}</span></div>
        <div class="body"><div class="subj"><span>${subject}</span><span class="tag">${abbr}</span></div>
        ${teacher?`<div class="detail">${teacher}</div>`:''}</div></article>`;
    }).join('');
  }
  function renderMeals(day){
    const rows=MEAL_TIMETABLE[day]||[];
    $('dayCount').textContent=rows.length;
    $('countLabel').textContent='meals';
    $('footerLeft').textContent='HOSTEL · WEEKLY FOOD ROUTINE';
    $('footerRight').textContent='MENU SUBJECT TO CHANGE';
    schedule.innerHTML=rows.map((r,i)=>{
      const [meal,food,tag,color]=r;
      const type=meal.toLowerCase();
      return `<article class="period meal-card p-${type}" style="animation-delay:${i*.04}s">
        <div class="slot"><span class="pnum">${meal}</span><span class="ptime">${['Breakfast','Lunch','Snacks','Dinner'].indexOf(meal)+1} / 4</span></div>
        <div class="body"><div class="subj"><span>${food}</span><span class="tag">${tag}</span></div></div>
      </article>`;
    }).join('');
  }
  function render(){
    $('dayTitle').textContent=DAY_NAMES[activeDay];
    if(activeView==='class')renderClass(activeDay);else renderMeals(activeDay);
  }
  function setDay(day){
    if(!DAY_KEYS.includes(day))return;
    activeDay=day;
    document.querySelectorAll('.day-tile').forEach(b=>{
      const on=b.dataset.day===day;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on));
    });
    render();
  }
  function setView(view){
    activeView=view;
    document.querySelector('.app').dataset.view=view;
    document.querySelectorAll('.main-tab').forEach(b=>{
      const on=b.dataset.view===view;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on));
    });
    if(view==='class'){
      $('pageHeading').innerHTML='Class <span>Timetable</span>';
      $('pageSubtitle').textContent='Monday — Friday · BCA Semester 1';
      $('pageBadge').textContent='BCA · SEM 1';
      document.querySelectorAll('.day-tile').forEach(b=>b.hidden=!CLASS_TIMETABLE[b.dataset.day]);
      if(!CLASS_TIMETABLE[activeDay])setDay('Mon');else render();
    }else{
      $('pageHeading').innerHTML='Hostel <span>Meal Plan</span>';
      $('pageSubtitle').textContent='Monday — Sunday · Boys’ Hostel';
      $('pageBadge').textContent='WEEKLY MENU';
      document.querySelectorAll('.day-tile').forEach(b=>b.hidden=false);
      render();
    }
  }
  document.querySelector('.main-nav').addEventListener('click',e=>{
    const button=e.target.closest('[data-view]');if(button)setView(button.dataset.view);
  });
  document.querySelector('.day-nav').addEventListener('click',e=>{
    const button=e.target.closest('[data-day]');if(button&&!button.hidden)setDay(button.dataset.day);
  });
  updateClock();markToday();
  setDay(todayKey());
  if(!CLASS_TIMETABLE[activeDay])setDay('Mon');
  setInterval(()=>{updateClock();markToday();},30000);
})();
  </script>
